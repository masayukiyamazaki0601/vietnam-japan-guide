# netlify.toml - japan-residence
# Multi-language static site (ja, vi, en, zh, ko, tl, ne, id, th, my, km)
# アジア言語10ヶ国語対応
# Language-based redirect: Japanese visitors → /ja/, Vietnamese visitors → /vi/

[[redirects]]
  from = "/"
  to = "/ja"
  status = 200
  force = true
  conditions = {Language = ["ja"]}

[[redirects]]
  from = "/"
  to = "/vi"
  status = 200
  force = true
  conditions = {Language = ["vi"]}

[[redirects]]
  from = "/"
  to = "/ja"
  status = 200
  force = true

# pages/ redirects
[[redirects]]
  from = "/pages/*"
  to = "/ja/pages/:splat"
  status = 200
  conditions = {Language = ["ja"]}

[[redirects]]
  from = "/pages/*"
  to = "/vi/pages/:splat"
  status = 200
  conditions = {Language = ["vi"]}

[[redirects]]
  from = "/pages/*"
  to = "/ja/pages/:splat"
  status = 200

# articles/ redirects (for backward compatibility with old URLs)
[[redirects]]
  from = "/articles/*"
  to = "/ja/articles/:splat"
  status = 200
  conditions = {Language = ["ja"]}

[[redirects]]
  from = "/articles/*"
  to = "/vi/articles/:splat"
  status = 200
  conditions = {Language = ["vi"]}

[[redirects]]
  from = "/articles/*"
  to = "/ja/articles/:splat"
  status = 200

# .vi.html old URLs → new vi/ subdirectory
[[redirects]]
  from = "/articles/*.vi.html"
  to = "/vi/articles/:splat"
  status = 301

# Sitemap
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200